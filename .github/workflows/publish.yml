name: PyPI Publish

on:
    release:
        types:
          - published

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: icinga-check-dns Deployment
        permissions:
            id-token: write

        steps:
          - name: Checkout code
            uses: actions/checkout@0f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

          - name: Setup Python
            uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b
            with:
              python-version: "3.12"

          - name: Install build dependencies
            run: |
                python -m pip install --upgrade pip
                pip install build

          - name: Build package
            run: python -m build

          - name: Publish to PyPI
            uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
            with:
                verbose: true
                repository-url: ${{ vars.REPOSITORY_URL }}
